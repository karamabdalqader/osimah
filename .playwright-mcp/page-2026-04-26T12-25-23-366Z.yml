      - generic [ref=e436]:
        - generic [ref=e437]:
          - button "What makes Osimah Digital different from other agencies in the Kingdom?" [ref=e438] [cursor=pointer]:
            - text: What makes Osimah Digital different from other agencies in the Kingdom?
            - img [ref=e440]
          - generic [ref=e442]: We're a Saudi technology house, not just an agency. That means we own the full stack — research, design, engineering, infrastructure and 24/7 operations — and we represent multiple global platform partners under one roof. One accountable team, from first brief to production uptime.
        - generic [ref=e443]:
          - button "Are you DGA-approved for government engagements?" [ref=e444] [cursor=pointer]:
            - text: Are you DGA-approved for government engagements?
            - img [ref=e446]
          - generic: Yes. Our delivery aligns to the Digital Government Authority's unified design system and compliance requirements. We've shipped DGA-approved platforms for the Ministry of Transport, Ministry of Justice, Ministry of Finance and the Real Estate General Authority.
        - generic [ref=e448]:
          - button "Which platforms do you specialize in?" [ref=e449] [cursor=pointer]:
            - text: Which platforms do you specialize in?
            - img [ref=e451]
          - generic: Sitecore, Adobe Experience Cloud, Liferay (Multinational Platinum), Umbraco and SharePoint — covering the DXP, portal and content management needs of ministries and enterprises. We also build on modern composable and headless stacks where they fit.
        - generic [ref=e453]:
          - button "Where is your team based?" [ref=e454] [cursor=pointer]:
            - text: Where is your team based?
            - img [ref=e456]
          - generic: Headquartered in Riyadh since 2017. We operate through our family of brands — Crafton Middle East, Interllias, Webtown and Kogifi Saudi — with delivery partners across EMEA for specialist capacity.
        - generic [ref=e458]:
          - button "What does a typical engagement look like?" [ref=e459] [cursor=pointer]:
            - text: What does a typical engagement look like?
            - img [ref=e461]
          - generic: Most engagements start with a discovery sprint (2–4 weeks) to align on audience, scope and compliance. From there, we move into iterative design, engineering and integration — shipping to a staging environment every two weeks. Production launch includes hypercare, then we can operate and evolve the platform long-term.
        - generic [ref=e463]:
          - button "Do you take on work outside Saudi Arabia?" [ref=e464] [cursor=pointer]:
            - text: Do you take on work outside Saudi Arabia?
            - img [ref=e466]
          - generic: Our focus is the Kingdom and the wider GCC, but we've delivered programs across the Middle East through our regional brands. If the project serves a Saudi audience, we're interested.
